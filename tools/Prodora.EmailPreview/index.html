<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prodora · E-posta önizlemeleri</title><style>
*{box-sizing:border-box}body{margin:0;background:#eceee8;color:#202a2d;font:14px "Segoe UI",Arial,sans-serif}header{background:white;border-bottom:1px solid #daded4;padding:24px 30px}h1{margin:0 0 8px;font-size:24px;letter-spacing:-.7px}p{color:#697166;margin:8px 0 18px}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:10px 16px;border:1px solid #cfd5ca;background:white;color:#202a2d;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#202a2d;color:white;border-color:#202a2d}.sizes{margin:20px auto;display:flex;justify-content:center;gap:8px}iframe{display:block;width:680px;max-width:100%;height:1100px;margin:0 auto 32px;border:1px solid #daded4;background:white}button:focus-visible{outline:3px solid #efb33f;outline-offset:3px}.note{max-width:680px;margin:20px auto;padding:0 18px;font-size:12px}
</style></head><body><header><h1><span style="color:#efb33f">.</span>Prodora · E-postalar</h1><p>Hesap onayı, e-posta değişikliği ve şifre yenileme aktif şablonlardır. Genel bildirim gelecekteki kullanımlar içindir.</p><nav aria-label="E-posta türü"><button data-page="hesap-onayi" aria-pressed="true">Hesap onayı</button><button data-page="sifre-yenileme" aria-pressed="false">Şifre yenileme</button><button data-page="eposta-degisikligi" aria-pressed="false">E-posta değişikliği</button><button data-page="genel-bildirim" aria-pressed="false">Genel bildirim</button></nav></header><div class="sizes"><button data-width="680" aria-pressed="true">Masaüstü</button><button data-width="375" aria-pressed="false">Mobil · 375 px</button></div><p class="note">Örnek isimler ve geçersiz örnek tokenlar kullanılır. Bu araç e-posta göndermez. Tarayıcı önizlemesi, gerçek e-posta istemcisi testi yerine geçmez.</p><iframe title="E-posta tasarımı" src="hesap-onayi.html" sandbox=""></iframe><script>
const frame=document.querySelector('iframe');
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{frame.src=button.dataset.page+'.html';document.querySelectorAll('[data-page]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));}));
</script></body></html>
